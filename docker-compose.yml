services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: assessment_db
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment123
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-judge0-db.sql:/docker-entrypoint-initdb.d/init-judge0-db.sql
    networks: [assessment-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [assessment-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-server:
    build:
      context: .
      dockerfile: docker/judge0/Dockerfile
    image: judge0-custom:local
    ports: ["2358:2358"]
    volumes: [./judge0.conf:/judge0.conf:ro]
    privileged: true
    networks: [assessment-network]
    depends_on: [judge0-workers, redis, postgres]
    restart: always

  judge0-workers:
    build:
      context: .
      dockerfile: docker/judge0/Dockerfile
    image: judge0-custom:local
    command: ["./scripts/workers"]
    volumes: [./judge0.conf:/judge0.conf:ro]
    privileged: true
    networks: [assessment-network]
    depends_on: [redis, postgres]
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8080:8080"]
    networks: [assessment-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assessment_db
      SPRING_DATASOURCE_USERNAME: assessment
      SPRING_DATASOURCE_PASSWORD: assessment123
      SPRING_REDIS_HOST: redis
      JUDGE0_BASE_URL: http://judge0-server:2358
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-change-in-production-please-use-a-long-key}
      CHALLENGE_TESTS_DIR: /challenge-tests

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    networks: [assessment-network]
    depends_on: [backend]

volumes:
  postgres_data:

networks:
  assessment-network:
    driver: bridge
