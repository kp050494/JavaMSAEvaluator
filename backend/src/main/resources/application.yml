spring:
  application:
    name: spring-arena-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assessment_db}
    username: ${SPRING_DATASOURCE_USERNAME:assessment}
    password: ${SPRING_DATASOURCE_PASSWORD:assessment123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Migrations embed Java starter code containing ${...}; never treat as Flyway placeholders.
    placeholder-replacement: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

# How submissions are graded:
#   "paiza"  (default) - real compile+run of single-file Java via the open Paiza.io API,
#   "piston"           - real compile+run via a (self-hosted) Piston instance,
#   "judge0"           - real Maven/JUnit in a self-hosted Judge0 sandbox,
#   "demo"             - heuristic grading (no execution).
execution:
  mode: ${EXECUTION_MODE:paiza}

# Paiza.io code-execution API (open; api_key "guest" needs no signup).
paiza:
  base-url: ${PAIZA_BASE_URL:https://api.paiza.io}
  api-key: ${PAIZA_API_KEY:guest}
  language: ${PAIZA_LANGUAGE:java}
  poll-timeout-seconds: ${PAIZA_POLL_TIMEOUT_SECONDS:60}
  poll-interval-ms: ${PAIZA_POLL_INTERVAL_MS:1500}

# Self-hosted Piston (only used when execution.mode=piston). The public emkc.org
# endpoint became whitelist-only in 2026, so point this at your own instance.
piston:
  execute-url: ${PISTON_EXECUTE_URL:http://localhost:2000/api/v2/execute}
  language: ${PISTON_LANGUAGE:java}
  version: ${PISTON_VERSION:15.0.2}
  run-timeout-ms: ${PISTON_RUN_TIMEOUT_MS:10000}
  compile-timeout-ms: ${PISTON_COMPILE_TIMEOUT_MS:10000}

judge0:
  base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
  auth-token: ${JUDGE0_AUTH_TOKEN:}
  # Judge0 language id used to run the multi-file Maven project.
  language-id: ${JUDGE0_LANGUAGE_ID:89}
  # A full Spring Boot Maven test run needs generous limits (see judge0.conf caps).
  cpu-time-limit: ${JUDGE0_CPU_TIME_LIMIT:120}
  wall-time-limit: ${JUDGE0_WALL_TIME_LIMIT:300}
  memory-limit: ${JUDGE0_MEMORY_LIMIT:2048000}
  # Max seconds to wait for a submission to finish (Maven builds are slow).
  poll-timeout-seconds: 180
  poll-interval-ms: 2000

challenge:
  tests-dir: ${CHALLENGE_TESTS_DIR:../challenge-tests}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-prod-please-use-a-long-256-bit-key-0123456789}
  expiry-hours: 8

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

logging:
  level:
    com.assessment: INFO
