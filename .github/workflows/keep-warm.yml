name: keep-backend-warm

# Pings the backend health endpoint so the Render free service doesn't spin down
# (it sleeps after ~15 min idle, causing a ~50s cold start on the next request).
# NOTE: GitHub's scheduled runs can be delayed/skipped under load — for strict
# uptime use an external pinger (UptimeRobot / cron-job.org) every 5-10 min too.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          # Change this URL if your backend host differs.
          curl -fsS --max-time 90 https://spring-arena-backend.onrender.com/api/health || true
