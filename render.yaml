# Render Blueprint for the Spring Arena backend (free PaaS demo).
# Frontend is deployed separately on Vercel; PostgreSQL on Neon.
# Import this repo as a Blueprint in the Render dashboard, then fill the
# `sync: false` secrets (Neon connection + your Vercel origin).
services:
  - type: web
    name: spring-arena-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Demo grading (no privileged Judge0 sandbox on free hosting).
      - key: EXECUTION_MODE
        value: demo
      # Keep the JVM inside the 512 MB free instance.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      # Neon PostgreSQL (set these in the dashboard — include ?sslmode=require).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Allow the Vercel frontend origin (e.g. https://spring-arena.vercel.app).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEBSOCKET_ALLOWED_ORIGINS
        sync: false
      # Auto-generated strong JWT signing secret.
      - key: JWT_SECRET
        generateValue: true
      # Recruiter login (change if you like).
      - key: RECRUITER_ADMIN_USERNAME
        value: admin
      - key: RECRUITER_ADMIN_PASSWORD
        value: admin123
