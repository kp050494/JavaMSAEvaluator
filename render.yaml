# Render Blueprint — full free deploy (backend + frontend) with REAL execution.
# Code runs on the Piston API (no privileged sandbox needed), so the free plan works.
# PostgreSQL = Supabase, Redis (optional) = Upstash — both external, set as secrets.
services:
  # ---- Spring Boot backend (Docker) ----
  - type: web
    name: spring-arena-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Real execution via the open Paiza.io API (guest key, no signup).
      - key: EXECUTION_MODE
        value: paiza
      # Keep the JVM inside the 512 MB free instance.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      # Supabase PostgreSQL (set in dashboard; include ?sslmode=require).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Upstash Redis (optional). Full TLS URL: rediss://default:<token>@<host>:<port>
      - key: SPRING_DATA_REDIS_URL
        sync: false
      # Frontend origin(s) for CORS + WebSocket (set to your frontend URL or *).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEBSOCKET_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RECRUITER_ADMIN_USERNAME
        value: admin
      - key: RECRUITER_ADMIN_PASSWORD
        value: admin123

  # ---- React frontend (static site) ----
  - type: web
    name: spring-arena-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      # Build-time: the backend's public URL (fill after the backend is created).
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
